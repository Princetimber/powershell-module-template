name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3.1.1
        with:
          versionSpec: '5.x'

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3.1.1

      - name: Build & Package Module
        shell: pwsh
        run: ./build.ps1 -ResolveDependency -tasks pack
        env:
          ModuleVersion: ${{ steps.gitversion.outputs.nuGetVersionV2 }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: module-output
          path: output/

  test:
    name: Test (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: module-output
          path: output/

      - name: Run Tests
        shell: pwsh
        run: ./build.ps1 -tasks test

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: output/testResults/

  lint:
    name: Lint (ScriptAnalyzer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Run ScriptAnalyzer
        shell: pwsh
        run: |
          # Each `run:` step is a fresh shell, so the import has to happen here
          # rather than in the install step. Import explicitly so an older copy
          # preinstalled on the runner image cannot win on PSModulePath, and so
          # the job fails loudly if only an older one is present.
          Import-Module PSScriptAnalyzer -MinimumVersion 1.25.0 -Force
          Write-Host "PSScriptAnalyzer $((Get-Module PSScriptAnalyzer).Version)"

          # Two rulesets, both enforced:
          #   PSGallery              - stricter publish-readiness gate
          #   PSScriptAnalyzerSettings.psd1 - the repo baseline, which is the
          #     only thing that covers the module manifest (.psd1); the QA suite
          #     only feeds exported function .ps1 files to ScriptAnalyzer.
          $failed = $false

          foreach ($ruleset in 'PSGallery', 'PSScriptAnalyzerSettings.psd1') {
            # PSScriptAnalyzer 1.25.0 intermittently throws NullReferenceException
            # from inside Invoke-ScriptAnalyzer (upstream thread-safety bug; it
            # reproduces with the default ruleset and no settings file). Retry that
            # specific exception. -ErrorAction Stop matters: without it the crash is
            # non-terminating, $results comes back short, and the job would report
            # "0 issues" for files that were never actually analysed.
            $results = $null

            foreach ($attempt in 1..3) {
              try {
                $results = Invoke-ScriptAnalyzer -Path source/ -Recurse -Settings $ruleset -ErrorAction Stop
                break
              }
              catch [System.NullReferenceException] {
                if ($attempt -eq 3) { throw }
                Write-Host "PSScriptAnalyzer threw NullReferenceException on attempt $attempt of 3 ($ruleset); retrying."
              }
            }

            if ($results) {
              Write-Host "ScriptAnalyzer ($ruleset): $($results.Count) issue(s)."
              $results | Format-Table -AutoSize
              $failed = $true
            }
            else {
              Write-Host "ScriptAnalyzer ($ruleset): 0 issues found."
            }
          }

          if ($failed) {
            throw 'ScriptAnalyzer reported issues.'
          }
